[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "signal-research-framework"
version = "0.1.0"
description = "An offline, synthetic-data framework for reproducible signal research"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "signal-research-framework contributors"}]
dependencies = ["numpy>=2,<3", "pandas>=3,<4", "matplotlib>=3.9"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
